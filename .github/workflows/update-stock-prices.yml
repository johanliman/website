name: Update Stock Prices

on:
  schedule:
    # Run every 5 minutes (shortest supported GitHub Actions cron interval)
    - cron: '*/5 * * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'pages/stock.html'
      - 'scripts/fetch_stock_prices.py'
      - '.github/workflows/update-stock-prices.yml'

concurrency:
  group: update-stock-prices
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  fetch-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch latest market prices
        run: |
          python3 scripts/fetch_stock_prices.py

      - name: Commit and push updated prices
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add assets/data/stock-prices.json
          if git diff --staged --quiet; then
            echo "No price updates to commit."
          else
            git commit -m "Automated update: live stock prices [skip ci]"
            git push
          fi
